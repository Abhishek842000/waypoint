services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      - "5433:5432"
    volumes:
      - waypoint_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm --filter @waypoint/db migrate:deploy && pnpm --filter @waypoint/api start"
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/waypoint?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret-change-me}
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      ESCALATION_DELAY_MULTIPLIER: ${ESCALATION_DELAY_MULTIPLIER:-1}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @waypoint/worker start
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/waypoint?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      ESCALATION_DELAY_MULTIPLIER: ${ESCALATION_DELAY_MULTIPLIER:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @waypoint/web dev --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  waypoint_pg:
