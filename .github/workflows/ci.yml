name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint?schema=public
      JWT_SECRET: ci-jwt-secret
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      STATUS_REVALIDATE_SECRET: ci-status-revalidate
      ESCALATION_DELAY_MULTIPLIER: "1"
      INCIDENT_CREATE_RATE_LIMIT: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @waypoint/db generate
      - run: pnpm --filter @waypoint/db migrate:deploy
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint?schema=public
      JWT_SECRET: ci-jwt-secret
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      STATUS_REVALIDATE_SECRET: ci-status-revalidate
      ESCALATION_DELAY_MULTIPLIER: "0.05"
      API_PORT: "3001"
      E2E_NO_WEBSERVER: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @waypoint/db generate
      - run: pnpm --filter @waypoint/db migrate:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright core flow
        run: |
          set -uo pipefail
          pnpm --filter @waypoint/api start > /tmp/waypoint-api.log 2>&1 &
          pnpm --filter @waypoint/worker start > /tmp/waypoint-worker.log 2>&1 &
          pnpm --filter @waypoint/web dev --port 3000 > /tmp/waypoint-web.log 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/health >/dev/null && curl -sf http://localhost:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "stack did not become ready"
            tail -n 100 /tmp/waypoint-*.log || true
            exit 1
          fi
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
